# CodeRoom production Nginx site for codingroom.duckdns.org.
#
# Install on the server:
#   sudo cp deploy/nginx/codingroom.duckdns.org.conf /etc/nginx/sites-available/
#   sudo ln -sf /etc/nginx/sites-available/codingroom.duckdns.org.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# The app container listens on 127.0.0.1:3000 (base docker-compose.yml).
# Adjust the certificate paths if Certbot stores them elsewhere.

map $http_upgrade $coderoom_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name codingroom.duckdns.org;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name codingroom.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/codingroom.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/codingroom.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Keep this slightly above Express's 2 MB JSON limit.
    client_max_body_size 3m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket upgrades for /ws and /yjs.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $coderoom_connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
