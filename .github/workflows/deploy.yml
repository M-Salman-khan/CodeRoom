name: Build and Deploy

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.vscode/**'
      - '.idea/**'
  workflow_dispatch:

# Prevent overlapping deployments; serialize runs safely without aborting in-flight deployments
concurrency:
  group: production-deployment
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  NODE_VERSION: 22

jobs:
  validate:
    name: Pre-flight Verification
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - name: Install client dependencies
        working-directory: client
        run: npm ci --no-audit --no-fund

      - name: Typecheck & build client
        working-directory: client
        run: npm run build

      - name: Install server dependencies
        working-directory: server
        run: npm ci --no-audit --no-fund

      - name: Typecheck & build server
        working-directory: server
        run: npm run build

      - name: Validate base Docker Compose configuration
        run: docker compose config -q
        env:
          AUTH_SECRET: ci-placeholder-secret-at-least-32-characters-long

      - name: Validate production Docker Compose overlay
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml config -q
        env:
          AUTH_SECRET: ci-placeholder-secret-at-least-32-characters-long
          DOMAIN: codingroom.duckdns.org
          PUBLIC_BASE_URL: https://codingroom.duckdns.org

  build-and-push:
    name: Build & Push Docker Image
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      short_sha: ${{ steps.vars.outputs.short_sha }}
      image_tag: ${{ steps.vars.outputs.image_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute short SHA and image tag
        id: vars
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          LOWER_REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "image_name=${{ env.REGISTRY }}/$LOWER_REPO" >> "$GITHUB_OUTPUT"
          echo "image_tag=${{ env.REGISTRY }}/$LOWER_REPO:sha-$SHORT_SHA" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.vars.outputs.image_name }}
          tags: |
            type=raw,value=latest
            type=sha,format=short,prefix=sha-

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VM
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Deploy to VM via SSH with Health Check & Rollback
        uses: appleboy/ssh-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          DEPLOY_TAG: ${{ needs.build-and-push.outputs.image_tag }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: ${{ secrets.VM_PORT || 22 }}
          command_timeout: 10m
          envs: GITHUB_TOKEN,GITHUB_ACTOR,DEPLOY_TAG
          script: |
            set -e

            echo "==> Navigating to project directory"
            cd ~/CodeRoom

            if [ ! -f .env ]; then
              echo "❌ Missing ~/CodeRoom/.env. Create it from .env.docker.example first."
              exit 1
            fi

            echo "==> Pulling latest repository configuration"
            git pull origin main

            echo "==> Authenticating Docker with GHCR"
            echo "$GITHUB_TOKEN" | sudo docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

            echo "==> Recording previous container image for rollback safety"
            PREV_IMAGE=$(sudo docker compose images -q coderoom 2>/dev/null || true)
            echo "Previous image ID: ${PREV_IMAGE:-None}"

            echo "==> Pulling immutable image tag: $DEPLOY_TAG"
            sudo IMAGE_TAG="$DEPLOY_TAG" docker compose pull coderoom

            echo "==> Updating containers (MongoDB data volume is preserved)"
            sudo IMAGE_TAG="$DEPLOY_TAG" docker compose up -d --remove-orphans --no-build

            echo "==> Waiting for container health check (up to 120s)..."
            HEALTHY=false
            for i in $(seq 1 24); do
              STATUS=$(sudo docker inspect --format='{{json .State.Health.Status}}' coderoom 2>/dev/null || echo '"unknown"')
              if [ "$STATUS" = '"healthy"' ]; then
                echo "✅ Container is healthy (check $i/24)"
                HEALTHY=true
                break
              fi
              echo "⏳ Health status: $STATUS (check $i/24)... waiting 5s"
              sleep 5
            done

            if [ "$HEALTHY" != "true" ]; then
              echo "❌ Health check failed for image $DEPLOY_TAG!"
              echo "==> Inspecting recent container logs:"
              sudo docker compose logs --tail=50 coderoom

              if [ -n "${PREV_IMAGE:-}" ]; then
                echo "⚠️ Initiating automated rollback to previous image: $PREV_IMAGE"
                sudo IMAGE_TAG="$PREV_IMAGE" docker compose up -d --no-build coderoom
                sleep 10
                sudo docker compose ps
                echo "⚠️ Rollback completed. Please inspect logs to diagnose failure."
              else
                echo "⚠️ No previous image recorded for automated rollback."
              fi
              exit 1
            fi

            echo "==> Verifying HTTP /api/health endpoint"
            HEALTH_JSON=$(curl -fsS http://localhost:3000/api/health || true)
            echo "$HEALTH_JSON"
            if ! echo "$HEALTH_JSON" | grep -Fq '"status":"healthy"'; then
              echo "❌ /api/health did not report a healthy status."
              exit 1
            fi
            echo "✅ /api/health endpoint responded with healthy status"

            echo "==> Verifying canonical public configuration"
            CONFIG_JSON=$(curl -fsS http://localhost:3000/api/config || true)
            echo "$CONFIG_JSON"

            EXPECTED_PUBLIC_URL=$(sed -n 's/^PUBLIC_BASE_URL=//p' .env | tail -n 1 | tr -d '"' | tr -d '\r')
            EXPECTED_PUBLIC_URL="${EXPECTED_PUBLIC_URL%/}"

            if ! echo "$CONFIG_JSON" | grep -Fq '"inviteLinksEnabled":true'; then
              echo "❌ Invitation links are disabled. Set PUBLIC_BASE_URL to the public HTTPS origin in ~/CodeRoom/.env and redeploy."
              exit 1
            fi

            if [ -n "$EXPECTED_PUBLIC_URL" ] && ! echo "$CONFIG_JSON" | grep -Fq "\"publicBaseUrl\":\"$EXPECTED_PUBLIC_URL\""; then
              echo "❌ /api/config does not match PUBLIC_BASE_URL=$EXPECTED_PUBLIC_URL."
              exit 1
            fi

            echo "✅ Canonical public configuration verified"

            if [ -n "$EXPECTED_PUBLIC_URL" ]; then
              echo "==> Checking public endpoint: $EXPECTED_PUBLIC_URL/api/health"
              if curl -fsS --max-time 15 "$EXPECTED_PUBLIC_URL/api/health" >/dev/null; then
                echo "✅ Public HTTPS endpoint is reachable"
              else
                echo "⚠️ Public endpoint check failed. Verify Nginx/TLS and that the domain proxies to 127.0.0.1:3000."
              fi
            fi

            echo "==> Deployment successfully verified!"
            sudo docker compose ps
