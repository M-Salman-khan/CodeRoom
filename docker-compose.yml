services:
  mongo:
    image: mongo:7
    container_name: coderoom-mongo
    restart: unless-stopped
    volumes:
      - coderoom-mongo:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\" | grep 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  coderoom:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${IMAGE_TAG:-ghcr.io/m-salman-khan/coderoom:latest}
    container_name: coderoom
    restart: unless-stopped
    stop_grace_period: 30s
    # Reap compiler/runtime child processes started by the code runner.
    init: true
    security_opt:
      - no-new-privileges:true
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      # Use the bundled MongoDB by default. Set MONGODB_URI in .env to point at
      # Atlas or another MongoDB host, then remove/disable the mongo service.
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongo:27017/coderoom}
      # Required: generate with `openssl rand -base64 48`. The server refuses to
      # start in production with the public development fallback secret.
      - AUTH_SECRET=${AUTH_SECRET:?Set AUTH_SECRET in .env (openssl rand -base64 48)}
      # Canonical public HTTPS origin used for invitation links. Example:
      # https://coderoom.example.com — leave empty to disable invite links.
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-}
      - CLIENT_ORIGIN=${CLIENT_ORIGIN:-http://localhost:3000}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
      # The app is only bound to 127.0.0.1 and must sit behind Caddy/Nginx.
      - TRUST_PROXY=${TRUST_PROXY:-1}
      - SEED_DATABASE=${SEED_DATABASE:-false}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

    # The container port is intentionally bound to loopback only. Put Caddy or
    # Nginx in front of it (see docker-compose.prod.yml and Caddyfile) so all
    # traffic, including /ws and /yjs, is served over HTTPS/WSS.

volumes:
  coderoom-mongo:
    name: coderoom-mongo
