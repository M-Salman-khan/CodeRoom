services:
  mongo:
    image: mongo:7
    container_name: coderoom-mongo
    restart: unless-stopped
    volumes:
      - coderoom-mongo:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\" | grep 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  coderoom:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${IMAGE_TAG:-ghcr.io/m-salman-khan/coderoom:latest}
    container_name: coderoom
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - MONGODB_URI=mongodb://mongo:27017/coderoom
      - AUTH_SECRET=${AUTH_SECRET:-coderoom-lan-super-secret-key-at-least-32-chars-long}
      - CLIENT_ORIGIN=${CLIENT_ORIGIN:-http://localhost:3000}
      - SEED_DATABASE=${SEED_DATABASE:-false}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

    # LAN Access Note:
    # To expose CodeRoom directly on the host network (and auto-detect LAN IPs),
    # uncomment network_mode and remove the `ports` block on Linux.

volumes:
  coderoom-mongo:
    name: coderoom-mongo
