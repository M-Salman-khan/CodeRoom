services:
  coderoom:
    build: .
    image: ${IMAGE_TAG:-ghcr.io/m-salman-khan/coderoom:latest}
    container_name: coderoom
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - DATABASE_URL=file:/app/data/coderoom.db
      - AUTH_SECRET=${AUTH_SECRET:-coderoom-lan-super-secret-key-at-least-32-chars-long}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-https://codingroom.duckdns.org}
      - SEED_DATABASE=${SEED_DATABASE:-false}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    volumes:
      # Persistent storage for SQLite database across container restarts and rebuilds
      - coderoom-data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

    # LAN Access Note:
    # On Linux, if you want CodeRoom to directly detect and display host LAN IP addresses
    # in the startup terminal banner, uncomment "network_mode: host" below and comment out "ports:".
    # network_mode: host

volumes:
  coderoom-data:
    name: coderoom-data
